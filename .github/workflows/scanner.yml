name: Holistic scanner (manual, scanner branch only)
on:
  push:
    branches: [scanner]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scanner/scan.py
      - name: Save results to scanner branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scanner/out/
          git commit -m "Scan results [skip ci]" && git push origin HEAD:scanner
