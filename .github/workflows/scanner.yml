name: Holistic scanner (manual, scanner branch only)
on:
  push:
    branches: [scanner]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scanner/scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scanner/out/
