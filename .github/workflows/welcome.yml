name: Holistic Welcome
on:
  schedule:
    - cron: "*/15 * * * *"     # check for new members every 15 min
  push:
    paths: ["welcome_launch.txt"]   # editing this file posts the @everyone welcome
  workflow_dispatch:
    inputs:
      mode:
        description: "new or everyone"
        default: "new"
permissions:
  contents: write
concurrency: welcome
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then echo "mode=everyone" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          else echo "mode=new" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python welcome.py ${{ steps.m.outputs.mode }}
      - name: Save state
        if: always()
        run: bash .github/scripts/save_state.sh "holistic-welcome-bot" "welcome state [skip ci]" state/
