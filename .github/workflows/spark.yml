name: Morning Spark
on:
  schedule:
    - cron: "33 12,13 * * *"   # 7:33 AM CT every day (both UTC hours; gate.py picks one)
  push:
    paths: ["spark.txt"]    # editing spark.txt posts one now
  workflow_dispatch:
permissions:
  contents: write
concurrency: spark
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daylight-saving guard
        id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "33 12,13 * * *") python gate.py 07:33 >> $GITHUB_OUTPUT ;;
            *) echo "go=true" >> $GITHUB_OUTPUT ;;
          esac
      - name: Post
        if: steps.g.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p state
          python spark.py 2>&1 | tee state/diag.txt; exit ${PIPESTATUS[0]}
      - name: Save state
        if: always()
        run: |
          git config user.name "holistic-spark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "spark state [skip ci]" && git pull --rebase && git push)
