name: Morning Spark
on:
  schedule:
    - cron: "33 12 * * *"   # 7:33 AM CT (daylight time), every day
  push:
    paths: ["spark.txt"]    # editing spark.txt posts one now
  workflow_dispatch:
permissions:
  contents: write
concurrency: spark
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p state
          python spark.py 2>&1 | tee state/diag.txt; exit ${PIPESTATUS[0]}
      - name: Save state
        if: always()
        run: |
          git config user.name "holistic-spark-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "spark state [skip ci]" && git pull --rebase && git push)
