name: Morning Spark
on:
  # timed runs are fired by the Post Clock (tick.yml); GitHub cron here ran hours late
  push:
    paths: ["spark.txt"]    # editing spark.txt posts one now
  workflow_dispatch:
permissions:
  contents: write
concurrency: spark
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Daylight-saving guard
        id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "33 12,13 * * *") python gate.py 07:33 >> $GITHUB_OUTPUT ;;
            *) echo "go=true" >> $GITHUB_OUTPUT ;;
          esac
      - name: Post
        if: steps.g.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          mkdir -p state
          python spark.py 2>&1 | tee state/diag.txt; exit ${PIPESTATUS[0]}
      - name: Save state
        if: always()
        run: bash .github/scripts/save_state.sh "holistic-spark-bot" "spark state [skip ci]" state/
