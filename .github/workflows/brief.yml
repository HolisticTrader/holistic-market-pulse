name: Morning Brief
on:
  schedule:
    - cron: "48 11,12 * * 1-5"   # 6:48 AM CT trading days (both UTC hours; gate.py picks one)
  push:
    paths: ["brief.txt"]      # editing brief.txt posts one now
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Daylight-saving guard
        id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "48 11,12 * * 1-5") python gate.py 06:48 >> $GITHUB_OUTPUT ;;
            *) echo "go=true" >> $GITHUB_OUTPUT ;;
          esac
      - name: Post
        if: steps.g.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python brief.py
