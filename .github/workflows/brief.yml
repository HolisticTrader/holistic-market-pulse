name: Morning Brief
on:
  schedule:
    - cron: "48 11 * * 1-5"   # 6:48 AM CT (daylight time), trading days
  push:
    paths: ["brief.txt"]      # editing brief.txt posts one now
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python brief.py
