name: Post New Discord Trade Update
on:
  push:
    paths:
      - "discord_trade_update.trigger"
permissions:
  contents: read
jobs:
  post-update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post live calls with tracking score
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          import pulse
          content, embeds = pulse.build("pulse")
          hook = os.environ["DISCORD_WEBHOOK_URL"].rstrip("/")
          meta_req = urllib.request.Request(hook, headers={"User-Agent": "HolisticMarketPulse/1.0"})
          with urllib.request.urlopen(meta_req, timeout=20) as response:
              channel_id = json.load(response)["channel_id"]
          payload = {
              "content": content,
              "embeds": embeds,
              "username": "Holistic Market Pulse",
              "allowed_mentions": {"parse": []}
          }
          token = os.environ["DISCORD_BOT_TOKEN"].strip()
          req = urllib.request.Request(
              f"https://discord.com/api/v10/channels/{channel_id}/messages",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={"Authorization": f"Bot {token}", "Content-Type": "application/json",
                       "User-Agent": "DiscordBot (https://github.com/HolisticTrader/holistic-market-pulse, 1.0)"})
          with urllib.request.urlopen(req, timeout=20) as response:
              message = json.load(response)
          print("Posted live update message ID:", message.get("id"))
          PY