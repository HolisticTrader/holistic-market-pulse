name: Holistic X Posts
on:
  schedule:
    - cron: "37 14 * * *"   # ~9:37 AM CT
    - cron: "12 23 * * *"   # ~6:12 PM CT
  workflow_dispatch:
permissions:
  contents: write
concurrency: xpost
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python xpost.py
      - name: Save state
        run: |
          git config user.name "holistic-x-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "x post state [skip ci]" && git pull --rebase && git push)
