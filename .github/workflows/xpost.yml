name: Holistic X Posts
on:
  schedule:
    - cron: "37 14 * * *"   # ~9:37 AM CT
    - cron: "12 23 * * *"   # ~6:12 PM CT
  workflow_dispatch:
permissions:
  contents: write
concurrency: xpost
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python xpost.py
      - name: Save state
        if: always()
        run: bash .github/scripts/save_state.sh "holistic-x-bot" "x post state [skip ci]" state/
