name: Holistic Trivia
on:
  schedule:
    # UTC for Central Daylight Time (UTC-5): one question 12 PM CT; answer + standings 9:30 PM CT
    - cron: "0 17 * * *"
    - cron: "30 2 * * *"
    - cron: "40 13 * * 5"   # Friday 8:40 AM CT all-time Hall of Fame
  push:
    paths: ["launch.txt", "round.txt", "halloffame.txt"]   # announcement / round now / hall of fame now
  workflow_dispatch:
    inputs:
      mode:
        description: "round, leaderboard or announce"
        default: "round"
permissions:
  contents: write
concurrency: trivia
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event_name }}" = "push" ]; then
            CH=$(git diff --name-only HEAD~1 HEAD)
            if echo "$CH" | grep -q '^launch.txt$'; then echo "mode=announce" >> $GITHUB_OUTPUT;
            elif echo "$CH" | grep -q '^halloffame.txt$'; then echo "mode=halloffame" >> $GITHUB_OUTPUT;
            else echo "mode=round" >> $GITHUB_OUTPUT; fi
          elif [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then echo "mode=leaderboard" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "40 13 * * 5" ]; then echo "mode=halloffame" >> $GITHUB_OUTPUT;
          else echo "mode=round" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL not set, skipping"; exit 0; fi
          python trivia.py ${{ steps.m.outputs.mode }}
      - name: Save state
        run: |
          git config user.name "holistic-trivia-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/trivia.json
          git diff --cached --quiet || (git commit -m "trivia state [skip ci]" && git pull --rebase && git push)
