name: Holistic Trivia
on:
  schedule:
    # Both UTC hours listed (daylight + standard); gate.py keeps the right one.
    - cron: "0 17,18 * * *"      # one question, 12 PM CT
    - cron: "30 2,3 * * *"       # answer + Dojo standings, 9:30 PM CT
    - cron: "40 13,14 * * 5"     # Friday 8:40 AM CT all-time Hall of Fame
  push:
    paths: ["launch.txt", "round.txt", "halloffame.txt"]   # announcement / round now / hall of fame now
  workflow_dispatch:
    inputs:
      mode:
        description: "round, leaderboard or announce"
        default: "round"
permissions:
  contents: write
concurrency: trivia
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event_name }}" = "push" ]; then
            CH=$(git diff --name-only HEAD~1 HEAD)
            if echo "$CH" | grep -q '^launch.txt$'; then echo "mode=announce" >> $GITHUB_OUTPUT;
            elif echo "$CH" | grep -q '^halloffame.txt$'; then echo "mode=halloffame" >> $GITHUB_OUTPUT;
            else echo "mode=round" >> $GITHUB_OUTPUT; fi
          elif [ "${{ github.event.schedule }}" = "30 2,3 * * *" ]; then echo "mode=leaderboard" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "40 13,14 * * 5" ]; then echo "mode=halloffame" >> $GITHUB_OUTPUT;
          else echo "mode=round" >> $GITHUB_OUTPUT; fi
      - name: Daylight-saving guard
        id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "0 17,18 * * *") python gate.py 12:00 >> $GITHUB_OUTPUT ;;
            "30 2,3 * * *") python gate.py 21:30 >> $GITHUB_OUTPUT ;;
            "40 13,14 * * 5") python gate.py 08:40 >> $GITHUB_OUTPUT ;;
            *) echo "go=true" >> $GITHUB_OUTPUT ;;
          esac
      - name: Run
        if: steps.g.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL not set, skipping"; exit 0; fi
          python trivia.py ${{ steps.m.outputs.mode }}
      - name: Save state
        if: always()
        run: bash .github/scripts/save_state.sh "holistic-trivia-bot" "trivia state [skip ci]" state/trivia.json
