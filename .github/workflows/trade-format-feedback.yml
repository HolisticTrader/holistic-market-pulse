name: Trade Format Feedback Post
on:
  push:
    paths:
      - "trade_format_feedback.trigger"
permissions:
  contents: read
jobs:
  post-feedback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Post updated format and ask for feedback
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          hook = os.environ["DISCORD_WEBHOOK_URL"].rstrip("/")
          payload = {
              "username": "Holistic Market Pulse",
              "allowed_mentions": {"parse": []},
              "content": "**📊 We’ve updated the trade call format — what do you think?**",
              "embeds": [{
                  "title": "🐂 +0.64% to +0.96% · overall example account gain",
                  "description": (
                      "**$100,000 FTMO account · 1%–1.5% risk per trade** "
                      "($1,000–$1,500 at each stop).\n\n"
                      "🟢 **IN PROFIT** · EUR/USD long · +19 pips · est. **+$950 to +$1,425**\n"
                      "🔴 **BELOW ENTRY** · GBP/USD short · −15.5 pips · est. **−$310 to −$465**\n\n"
                      "**Net example:** +$640 to +$960, or **+0.64% to +0.96%** on $100,000.\n\n"
                      "*Illustrative values to show the format, not live trade calls. Estimate uses entry-to-stop risk; fees and swaps excluded.*"
                  ),
                  "color": 0x39FF14,
                  "footer": {"text": "Would you like us to use this format? Reply 👍 or 👎, or tell us what you’d change."}
              }]
          }
          # Use the configured bot to send a normal channel post; the webhook remains a fallback.
          try:
              req = urllib.request.Request(hook, headers={"User-Agent": "HolisticMarketPulse/1.0"})
              with urllib.request.urlopen(req, timeout=20) as response:
                  channel_id = json.load(response)["channel_id"]
              token = os.environ.get("DISCORD_BOT_TOKEN", "").strip()
              if not token:
                  raise RuntimeError("DISCORD_BOT_TOKEN is not configured")
              api = urllib.request.Request(
                  f"https://discord.com/api/v10/channels/{channel_id}/messages",
                  data=json.dumps(payload).encode(), method="POST",
                  headers={"Authorization": f"Bot {token}", "Content-Type": "application/json",
                           "User-Agent": "DiscordBot (https://github.com/HolisticTrader/holistic-market-pulse, 1.0)"})
              with urllib.request.urlopen(api, timeout=20) as response:
                  result = json.load(response)
              print("Posted Discord message ID:", result.get("id"))
          except Exception as bot_error:
              print("Bot send failed; trying configured webhook.")
              url = hook + "?wait=true"
              req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="POST",
                                           headers={"Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      result = json.load(response)
                  print("Posted Discord message ID:", result.get("id"))
              except urllib.error.HTTPError as error:
                  print("Webhook POST failed:", error.code, error.read()[:300].decode("utf-8", "replace"))
                  raise
          PY