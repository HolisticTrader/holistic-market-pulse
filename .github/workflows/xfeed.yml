name: Hot on X to Discord
on:
  push:
    paths: ["xfeed.txt"]   # the Holistic X hot feed task writes the digest here; each push posts it once
concurrency: xfeed
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python xfeed.py
