name: Holistic Market Pulse
on:
  schedule:
    # Times are UTC. While Central is on daylight time (UTC-5):
    - cron: "*/15 * * * 0-5"      # live board refresh every 15 min, Sun-Fri (FX week)
    - cron: "7 11-23 * * 1-5"     # weekdays hourly 6 AM-6 PM CT
    - cron: "7 0-3 * * 2-6"       # weekdays hourly 7-10 PM CT (still the CT weekday)
    - cron: "17 */4 * * 0,6"      # weekends: crypto-only every 4 hours
  push:
    paths: ["board_refresh.txt"]   # editing this file forces a board refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "board or pulse"
        default: "pulse"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event_name }}" = "push" ]; then echo "mode=board" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "*/15 * * * 0-5" ]; then echo "mode=board" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "17 */4 * * 0,6" ]; then echo "mode=crypto" >> $GITHUB_OUTPUT;
          else echo "mode=pulse" >> $GITHUB_OUTPUT; fi
      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BOARD_MESSAGE_ID: ${{ vars.BOARD_MESSAGE_ID || '1560756485061873665' }}
        run: python pulse.py ${{ steps.m.outputs.mode }}
