name: Holistic Market Pulse
on:
  schedule:
    - cron: "*/15 * * * 0-5"      # live board: edits the pinned message every 15 min (no new posts)
    # timed posts (3:15 PM update) are fired by the Post Clock (tick.yml)
  push:
    paths: ["board_refresh.txt"]   # editing this file forces a board refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "board or pulse"
        default: "pulse"
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pick mode
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event_name }}" = "push" ]; then echo "mode=board" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "*/15 * * * 0-5" ]; then echo "mode=board" >> $GITHUB_OUTPUT;
          elif [ "${{ github.event.schedule }}" = "0 15,16 * * 6" ]; then echo "mode=crypto" >> $GITHUB_OUTPUT;
          else echo "mode=pulse" >> $GITHUB_OUTPUT; fi
      - name: Daylight-saving guard
        id: g
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          case "${{ github.event.schedule }}" in
            "15 20,21 * * 1-5") python gate.py 15:15 >> $GITHUB_OUTPUT ;;
            "0 15,16 * * 6") python gate.py 10:00 >> $GITHUB_OUTPUT ;;
            *) echo "go=true" >> $GITHUB_OUTPUT ;;
          esac
      - name: Run
        if: steps.g.outputs.go == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BOARD_MESSAGE_ID: ${{ vars.BOARD_MESSAGE_ID || '1560756485061873665' }}
        run: python pulse.py ${{ steps.m.outputs.mode }}
